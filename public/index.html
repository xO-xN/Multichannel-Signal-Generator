<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multichannel Signal Generator — 16-ch sine wave test</title>
  <style>
    :root {
      --bg: #edf0ef;
      --card: #f9fbfa;
      --text: #20332f;
      --muted: #62716c;
      --accent: #256c5b;
      --accent-soft: #dfede7;
      --danger: #bc354a;
      --track: #d6dfdb;
      --line: color-mix(in srgb, var(--text) 18%, var(--card));
      --surface: color-mix(in srgb, var(--card) 70%, var(--bg));
      --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      --radius: 18px;
      --duration: 140ms;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 48px);
    }
    button, input, summary { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
    }
    .instrument { inline-size: min(1040px, 100%); }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-block-end: 28px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .brand svg { inline-size: 28px; block-size: 20px; color: var(--accent); }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
    h1 { font-size: clamp(27px, 3.8vw, 42px); font-weight: 650; letter-spacing: -0.055em; margin: 0; line-height: 1.1; }
    header .sub { display: block; margin-block-start: 10px; font-size: 12px; line-height: 1.6; color: var(--muted); }
    .activity { text-align: end; flex-shrink: 0; }
    .activity-value { display: block; font-family: var(--mono); font-size: 28px; letter-spacing: -0.06em; line-height: 1.2; }
    .activity-value small { font-size: 14px; color: var(--muted); }
    .activity-label { display: block; font-size: 10px; color: var(--muted); margin-block-start: 5px; }
    .panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 168px;
      margin-block-start: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--text) 5%, transparent);
      overflow: hidden;
    }
    .channels { padding: 20px; min-inline-size: 0; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-block-end: 18px; }
    .section-label { font-size: 11px; font-weight: 600; margin: 0; }
    .frequency-range { font-family: var(--mono); font-size: 10px; color: var(--muted); }
    #rack { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
    .tone {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: start;
      min-inline-size: 0;
      padding: 12px 8px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) / 3);
      cursor: default;
      user-select: none;
      transition: background var(--duration), border-color var(--duration), box-shadow var(--duration);
    }
    .tone:hover { border-color: var(--accent); }
    .tone:active { box-shadow: inset 0 0 0 1px var(--accent); }
    .tone.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .tone .channel-label { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 0.08em; }
    .tone .channel { font-family: var(--mono); font-size: clamp(25px, 3vw, 35px); letter-spacing: -0.065em; font-weight: 500; margin-block: 5px 8px; line-height: 1; }
    .tone .freq { font-family: var(--mono); font-size: 8.5px; color: var(--muted); white-space: nowrap; }
    .tone .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 3px; margin-block-start: 18px; }
    .tone .state { font-family: var(--mono); font-size: 9px; line-height: 1; }
    .tone .switch { position: relative; inline-size: 20px; block-size: 13px; border: 1px solid var(--muted); border-radius: 3px; flex-shrink: 0; }
    .tone .switch::after { content: ''; position: absolute; inset-block: 2px; inset-inline-start: 2px; inline-size: 7px; background: var(--muted); border-radius: 1px; transition: transform var(--duration), background var(--duration); }
    .tone.active .switch { border-color: var(--accent); }
    .tone.active .switch::after { transform: translateX(7px); background: var(--accent); }
    [dir='rtl'] .tone.active .switch::after { transform: translateX(-7px); }
    .master {
      border-inline-start: 1px solid var(--line);
      background: var(--surface);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .master label { align-self: stretch; font-size: 11px; font-weight: 600; }
    .master .value { align-self: stretch; margin-block-start: 17px; font-family: var(--mono); font-size: 20px; letter-spacing: -0.06em; white-space: nowrap; }
    .fader { position: relative; inline-size: 108px; block-size: 186px; margin-block: 14px; }
    .master input[type='range'] {
      position: absolute;
      inset-inline-start: 50%;
      inset-block-start: 50%;
      inline-size: 180px;
      block-size: 30px;
      margin: 0;
      transform: translate(-50%, -50%) rotate(-90deg);
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: default;
    }
    .master input::-webkit-slider-runnable-track { block-size: 3px; border-radius: 2px; background: var(--line); }
    .master input::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; inline-size: 14px; block-size: 28px; margin-block-start: -12px; border: 1px solid var(--accent); border-radius: 3px; background: var(--card); box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 4px var(--accent); }
    .master input::-moz-range-track { block-size: 3px; border-radius: 2px; background: var(--line); }
    .master input::-moz-range-thumb { inline-size: 14px; block-size: 28px; border: 1px solid var(--accent); border-radius: 3px; background: var(--card); }
    .scale { position: absolute; inset-block: 0; inset-inline-end: 0; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--mono); font-size: 9px; color: var(--muted); }
    .scale span::before { content: ''; display: inline-block; inline-size: 6px; border-block-start: 1px solid var(--line); margin-inline-end: 7px; vertical-align: middle; }
    .master-note { font-size: 10px; line-height: 1.5; text-align: center; color: var(--muted); margin: auto 0 0; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-block-start: 16px; color: var(--muted); font-size: 11px; }
    .signal-note { margin: 0; line-height: 1.6; }
    [data-utility-theme='brutal'] { --radius: 0px; --duration: 0ms; --line: var(--text); }
    [data-utility-theme='brutal'] .panel { box-shadow: 4px 4px 0 var(--text); }
    @media (max-width: 820px) {
      body { padding: 24px; }
      .brand { margin-block-end: 24px; }
      #rack { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .tone .channel { font-size: 34px; }
      .tone .freq, .tone .state { font-size: 10px; }
      .panel { grid-template-columns: minmax(0, 1fr) 160px; }
      .channels { padding: 20px; }
      .master { padding-inline: 16px; }
      .master .value { font-size: 19px; }
    }
    @media (max-width: 540px) {
      body { padding: 24px 16px; }
      .brand { margin-block-end: 22px; }
      header { align-items: flex-start; gap: 12px; }
      h1 { font-size: 29px; }
      header .sub { max-inline-size: 220px; font-size: 11px; }
      .activity-value { font-size: 23px; }
      .activity-label { max-inline-size: 68px; line-height: 1.5; font-size: 9px; }
      .panel { grid-template-columns: 1fr; margin-block-start: 22px; }
      .channels { padding: 16px; }
      .tone { padding: 12px 8px 10px; }
      .tone .channel { font-size: 30px; }
      .tone .freq { font-size: 9px; }
      .master { border-inline-start: 0; border-block-start: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; padding: 18px 20px; gap: 12px; }
      .master label { align-self: center; }
      .master .value { margin: 0; font-size: 22px; }
      .fader { grid-column: 1 / -1; inline-size: 100%; block-size: 30px; margin: 0; }
      .master input[type='range'] { inset-inline-start: 0; inset-block-start: 0; inline-size: 100%; transform: none; }
      .master input::-webkit-slider-thumb { inline-size: 16px; block-size: 24px; margin-block-start: -10px; }
      .scale { display: none; }
      .master-note { grid-column: 1 / -1; margin: 0; text-align: start; }
      footer { align-items: flex-start; gap: 10px; }
      .signal-note { max-inline-size: 160px; padding-block-start: 4px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      :root { --duration: 0ms; }
    }
  </style>
  <!-- Theme following (score project spec §5.3) and locale following
       (network reference "Locale Following"): zero-config — the theme
       module writes the App's pnds:theme palette into the CSS
       variables above, the locale module holds the App's pnds:locale
       language, and the page renders its copy through the bilingual
       tables in copy.js (subscribed to switches below). Monitor page
       only; the performer port serves no page. -->
  <script data-theme-options>
    window.PNDS_THEME_OPTIONS = {
      onTheme(name) {
        document.documentElement.setAttribute('data-utility-theme', name)
      },
    }
  </script>
  <script src="/__pnds/theme-follow.js"></script>
  <script src="/__pnds/locale-follow.js"></script>
  <script src="/copy.js"></script>
</head>
<body>
  <main class="instrument">
    <div class="brand">
      <svg viewBox="0 0 28 20" fill="none" aria-hidden="true"><path d="M1 10h3c3 0 2-7 5-7s2 14 5 14 2-14 5-14 2 7 5 7h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
      <span>PNDS UTILITY</span>
    </div>
    <header>
      <div>
        <h1>Multichannel Gen</h1>
        <span class="sub" id="meta">16-ch sine wave test — all muted by default</span>
      </div>
      <div class="activity">
        <span class="activity-value"><span id="active-count">00</span><small> / 16</small></span>
        <span class="activity-label" id="activity-label">Enabled channels</span>
      </div>
    </header>

    <div class="panel">
      <section class="channels" aria-labelledby="tones-label">
        <div class="section-head">
          <h2 class="section-label" id="tones-label">Test tones</h2>
          <span class="frequency-range" id="frequency-range"></span>
        </div>
        <div id="rack" role="group" aria-label="16 test-tone toggles"></div>
      </section>
      <div class="master">
        <label for="master" id="master-label">Master</label>
        <output class="value" id="master-value" for="master">-6.0 dBFS</output>
        <div class="fader">
          <input id="master" type="range" min="0" max="1000" step="1" value="900" aria-label="Master volume" aria-valuetext="-6.0 dBFS" />
          <div class="scale" aria-hidden="true"><span>0</span><span>−12</span><span>−24</span><span>−36</span><span>−48</span><span id="scale-mute">Mute</span></div>
        </div>
        <p class="master-note" id="master-note">Applies to enabled tones</p>
      </div>
    </div>

    <footer>
      <p class="signal-note" id="signal-note">Sine wave · One semitone per channel</p>
    </footer>
  </main>

  <script src="/control-client.js"></script>
  <script>
    'use strict'
    const CHANNELS = 16
    const BASE_FREQUENCY = 440
    const MIN_DB = -60
    const MAX_DB = 0

    function toneFrequency(index) {
      return BASE_FREQUENCY * Math.pow(2, index / 12) // index 0-based here
    }

    /** The copy table of the current locale (locale bridge + copy.js). */
    function currentCopy() {
      return PNDS_COPY[PNDS_LOCALE.current()]
    }

    /** Master fader position 0..1 -> dBFS label. */
    function valueToDb(value) {
      if (value === 0) return currentCopy().mute
      return (MIN_DB + value * (MAX_DB - MIN_DB)).toFixed(1) + ' dBFS'
    }

    let controlReady = false
    let masterIntent = null
    const pendingTones = new Set()
    function setTone(channel, on) {
      pendingTones.add(channel)
      paintState()
      void controls.setTone(channel, on).finally(() => { pendingTones.delete(channel); paintState() })
    }
    function setMaster(value) { masterIntent = value; void controls.setMaster(value) }

    function buildTone(channel) {
      const freq = toneFrequency(channel - 1)
      const copy = currentCopy()
      const tone = document.createElement('button')
      tone.type = 'button'
      tone.className = 'tone'
      tone.setAttribute('aria-label', copy.channelAriaPrefix + channel + copy.channelAriaSuffix)
      tone.setAttribute('aria-pressed', 'false')

      const channelLabel = document.createElement('span')
      channelLabel.className = 'channel-label'
      channelLabel.textContent = 'CH'
      channelLabel.setAttribute('aria-hidden', 'true')

      const ch = document.createElement('span')
      ch.className = 'channel'
      ch.textContent = channel.toString().padStart(2, '0')

      const freqEl = document.createElement('span')
      freqEl.className = 'freq'
      freqEl.textContent = freq.toFixed(1) + ' Hz'

      const switchRow = document.createElement('span')
      switchRow.className = 'switch-row'
      switchRow.setAttribute('aria-hidden', 'true')
      const stateLabel = document.createElement('span')
      stateLabel.className = 'state'
      stateLabel.textContent = copy.off
      const switchMark = document.createElement('span')
      switchMark.className = 'switch'
      switchRow.append(stateLabel, switchMark)

      tone.append(channelLabel, ch, freqEl, switchRow)
      tone.addEventListener('click', () => {
        const on = !tone.classList.contains('active')
        setTone(channel, on)
      })
      return { tone, stateLabel, channel }
    }

    const rack = document.getElementById('rack')
    const tones = []
    for (let i = 1; i <= CHANNELS; i += 1) {
      const entry = buildTone(i)
      tones.push(entry)
      rack.appendChild(entry.tone)
    }

    document.getElementById('frequency-range').textContent =
      Math.round(toneFrequency(0)) + '–' + Math.round(toneFrequency(CHANNELS - 1)) + ' Hz'

    function updateActivity() {
      const enabled = tones.filter(({ tone }) => tone.classList.contains('active')).length
      document.getElementById('active-count').textContent = String(enabled).padStart(2, '0')
    }

    const master = document.getElementById('master')
    const masterValue = document.getElementById('master-value')
    master.addEventListener('input', () => {
      const value = Number(master.value) / 1000
      masterValue.textContent = valueToDb(value)
      master.setAttribute('aria-valuetext', masterValue.textContent)
      setMaster(value)
    })

    // The host-declared channel count once /api/state reports one that
    // differs from this page's 16 (e.g. a degraded 16ch -> 2ch bridge).
    let hostChannels = null

    // Re-render every translatable string through the current locale's
    // copy table — once here (so ?lang= paints the first frame) and on
    // every App language switch. Idempotent: same locale, same strings.
    function applyCopy() {
      const copy = currentCopy()
      document.title = copy.title
      document.getElementById('meta').textContent = hostChannels
        ? copy.degradedPrefix + hostChannels + copy.degradedSuffix
        : copy.meta
      document.getElementById('master-label').textContent = copy.master
      master.setAttribute('aria-label', copy.masterAria)
      masterValue.textContent = valueToDb(Number(master.value) / 1000)
      master.setAttribute('aria-valuetext', masterValue.textContent)
      rack.setAttribute('aria-label', copy.rackAria)
      for (const { tone, stateLabel, channel } of tones) {
        tone.setAttribute('aria-label', copy.channelAriaPrefix + channel + copy.channelAriaSuffix)
        stateLabel.textContent = tone.classList.contains('active') ? copy.on : copy.off
      }
      document.getElementById('activity-label').textContent = copy.activity
      document.getElementById('tones-label').textContent = copy.tones
      document.getElementById('master-note').textContent = copy.masterNote
      document.getElementById('scale-mute').textContent = copy.mute
      document.getElementById('signal-note').textContent = copy.signalNote
      updateActivity()
    }

    PNDS_LOCALE.subscribe(applyCopy)
    applyCopy()

    let state = null
    function paintState() {
      for (const { tone, stateLabel, channel } of tones) {
        const fact = state && state.tones.find(item => item.channel === channel)
        const on = !!(fact && fact.on)
        tone.classList.toggle('active', on)
        tone.setAttribute('aria-pressed', String(on))
        tone.disabled = !controlReady || pendingTones.has(channel)
        stateLabel.textContent = on ? currentCopy().on : currentCopy().off
      }
      master.disabled = !controlReady
      if (state && (masterIntent === null || Math.abs(state.masterValue - masterIntent) < 0.000001)) {
        masterIntent = null
        master.value = String(Math.round(state.masterValue * 1000))
      }
      masterValue.textContent = valueToDb(Number(master.value) / 1000)
      master.setAttribute('aria-valuetext', masterValue.textContent)
      rack.setAttribute('aria-busy', String(!controlReady))
      updateActivity()
    }
    const controls = PNDS_CONTROL.create({
      onState(next) {
        state = next
        controlReady = true
        hostChannels = next.outputChannels !== CHANNELS ? next.outputChannels : null
        applyCopy()
        paintState()
      },
      onError(error) {
        controlReady = false
        masterIntent = null
        paintState()
        console.error('Control state unavailable:', error)
      },
    })
    paintState()
    controls.start()
    window.addEventListener('pagehide', () => controls.stop())
    window.addEventListener('pageshow', () => controls.start())
  </script>
</body>
</html>
